name: Package addon

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the addon
        run: zip -r "plugin.video.internetarchive-1.0.0.zip" "plugin.video.internetarchive"
      - name: Upload addon zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin.video.internetarchive
          path: plugin.video.internetarchive-1.0.0.zip
      - name: Attach addon zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: plugin.video.internetarchive-1.0.0.zip
